name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v1.0.0)
        required: true
        type: string
      title:
        description: Release title (leave empty to use the tag)
        required: false
        type: string
      draft:
        description: Create as a draft release
        required: true
        default: true
        type: boolean
      prerelease:
        description: Mark as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Tag must use a version format such as v1.0.0 or v1.0.0-rc.1."
          }

      - name: Build release binaries
        shell: cmd
        run: call build_cpp.bat

      - name: Verify release files
        shell: pwsh
        run: |
          $required = @(
            'dist/x86/UI_TouchKeyboard_x86.exe',
            'dist/x64/UI_TouchKeyboard_x64.exe',
            'dist/release/UI_TouchKeyboard_X86_X64.7z'
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Missing release file: $file"
            }
          }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: UI_TouchKeyboard_${{ inputs.tag }}
          if-no-files-found: error
          path: |
            dist/x86/UI_TouchKeyboard_x86.exe
            dist/x64/UI_TouchKeyboard_x64.exe
            dist/release/UI_TouchKeyboard_X86_X64.7z

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.title || inputs.tag }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/x86/UI_TouchKeyboard_x86.exe
            dist/x64/UI_TouchKeyboard_x64.exe
            dist/release/UI_TouchKeyboard_X86_X64.7z
